<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Observer Avoidance FM — Live</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>OBSERVER AVOIDANCE FM</h1>
      <p>v21 · 선수/옵저버 크기 -15% · 접촉 빈도 추가 감소 · 2.90초 예측 회피 · 더 강한 인코스/APEX · 7시→5시 상단 라인 최적화 · 버벅임 개선</p>
    </div>
    <div id="buildBadge" style="font-weight:800;margin-right:12px">BUILD v21</div>
    <div class="controls">
      <button id="startBtn">LIVE 시작</button>
      <button id="restartBtn">재시작</button>
    </div>
  </header>

  <main class="layout">
    <section class="broadcast">
      <div class="livebar">
        <span class="live-dot"></span><b>LIVE</b>
        <span id="cameraLabel">v21 · OBS 600 · 로딩 중</span>
        <span id="clock">00:00.0</span>
      </div>
      <canvas id="race" width="1600" height="900"></canvas>
    </section>

    <aside class="ranking">
      <h2>실시간 순위</h2>
      <div id="rankingList"></div>
    </aside>
  </main>

  <script src="game-v21.js?v=2102"></script>
</body>
</html>
