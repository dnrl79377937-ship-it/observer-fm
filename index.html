<!doctype html>
<html lang="ko">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Observer Avoidance FM — Live</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>OBSERVER AVOIDANCE FM</h1>
      <p>v32 · 1R 스커지 · 2R 스카웃 · 3R 레이스 · 프레임 멈춤 최적화 · OBS 726</p>
    </div>
    <div id="buildBadge" style="font-weight:800;margin-right:12px">BUILD v32</div>
    <div class="controls">
      <button id="startBtn">LIVE 시작</button>
      <button id="restartBtn">재시작</button>
      <button id="resultBtn">경기 통계</button>
      <button id="seasonResetBtn">시즌 초기화</button>
    </div>
  </header>

  <main class="layout">
    <section class="broadcast">
      <div class="livebar">
        <span class="live-dot"></span><b>LIVE</b>
        <span id="cameraLabel">v32 · SCOURGE → SCOUT → WRAITH · OBS 726</span>
        <span id="clock">00:00.0</span>
      </div>
      <div id="teamScoreBoard" class="team-score-board"></div>
      <div id="personalScoreBoard" class="personal-score-board"></div>
      <canvas id="race" width="1600" height="900"></canvas>
    </section>

    <aside class="ranking">
      <h2>실시간 순위</h2>
      <div id="rankingList"></div>
    </aside>
  </main>


  <div id="playerModal" class="overlay hidden">
    <div class="modalCard">
      <button id="playerModalClose" class="closeBtn">×</button>
      <h2 id="playerModalTitle">선수 정보</h2>
      <div id="playerModalBody"></div>
    </div>
  </div>

  <div id="resultPanel" class="overlay hidden">
    <div class="modalCard resultCard">
      <button id="resultClose" class="closeBtn">×</button>
      <h2>4vs4 · 3라운드 팀전 결과</h2>
      <div id="teamResultSummary"></div>
      <div class="tableWrap">
        <table class="resultTable">
          <thead><tr><th>개인총점순위</th><th>팀</th><th>선수</th><th>1R 순위/점수</th><th>2R 순위/점수</th><th>3R 순위/점수</th><th>총점</th></tr></thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="game.js?v=3201"></script>
</body>
</html>
