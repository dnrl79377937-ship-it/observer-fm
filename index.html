<!doctype html>
<html lang="ko">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Observer Avoidance FM — Live</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>OBSERVER AVOIDANCE FM</h1>
      <p>v30 · 선수 능력치 카드 · 경기 상세 통계 · v29 주행성향 유지 · OBS 660</p>
    </div>
    <div id="buildBadge" style="font-weight:800;margin-right:12px">BUILD v30</div>
    <div class="controls">
      <button id="startBtn">LIVE 시작</button>
      <button id="restartBtn">재시작</button>
      <button id="resultBtn">경기 통계</button>
    </div>
  </header>

  <main class="layout">
    <section class="broadcast">
      <div class="livebar">
        <span class="live-dot"></span><b>LIVE</b>
        <span id="cameraLabel">v30 · OBS 660 · 로딩 중</span>
        <span id="clock">00:00.0</span>
      </div>
      <canvas id="race" width="1600" height="900"></canvas>
    </section>

    <aside class="ranking">
      <h2>실시간 순위</h2>
      <div id="rankingList"></div>
    </aside>
  </main>


  <div id="playerModal" class="overlay hidden">
    <div class="modalCard">
      <button id="playerModalClose" class="closeBtn">×</button>
      <h2 id="playerModalTitle">선수 정보</h2>
      <div id="playerModalBody"></div>
    </div>
  </div>

  <div id="resultPanel" class="overlay hidden">
    <div class="modalCard resultCard">
      <button id="resultClose" class="closeBtn">×</button>
      <h2>경기 상세 통계</h2>
      <div class="tableWrap">
        <table class="resultTable">
          <thead><tr><th>순위</th><th>선수</th><th>기록</th><th>충돌</th><th>정지</th><th>회피</th><th>추월</th><th>선두</th><th>최대상승</th><th>최대하락</th><th>거리</th><th>평균속도</th></tr></thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="game.js?v=3001"></script>
</body>
</html>
