<!doctype html>
<html lang="ko">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Observer Avoidance FM — Live</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>OBSERVER AVOIDANCE FM</h1>
      <p>v25 · 최단/최속 주행라인 플래너 · 겹침 버벅임 추가 최적화 · OBS 660</p>
    </div>
    <div id="buildBadge" style="font-weight:800;margin-right:12px">BUILD v25</div>
    <div class="controls">
      <button id="startBtn">LIVE 시작</button>
      <button id="restartBtn">재시작</button>
    </div>
  </header>

  <main class="layout">
    <section class="broadcast">
      <div class="livebar">
        <span class="live-dot"></span><b>LIVE</b>
        <span id="cameraLabel">v25 · OBS 660 · 로딩 중</span>
        <span id="clock">00:00.0</span>
      </div>
      <canvas id="race" width="1600" height="900"></canvas>
    </section>

    <aside class="ranking">
      <h2>실시간 순위</h2>
      <div id="rankingList"></div>
    </aside>
  </main>

  <script src="game.js?v=2501"></script>
</body>
</html>
